name: Validate
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The project currently has no committed npm lockfile.
      # Skip setup-node's cache until package-lock.json is tracked.
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
